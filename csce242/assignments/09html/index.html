    <div class="w3-modal-content w3-animate-top">
      <div class="w3-container" id="modal-body">
        <span id="modal-close" class="w3-button w3-display-topright">&times;</span>
        <iframe id="modal-map" title="Map of vacation destination" loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"></iframe>
        <div id="modal-info">
          <h3 id="modal-title"></h3>
          <p><strong>Type:</strong> <span id="modal-type"></span></p>
          <p><strong>Description:</strong> <span id="modal-description"></span></p>
          <p><strong>Things To Do:</strong> <span id="modal-things"></span></p>

      </div>
    </div>
